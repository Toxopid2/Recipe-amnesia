modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Toxopid2"
logoFile="logo.png"
description='''
Every few minutes (5 by default) ALL recipes, mob drops and block drops are reshuffled.
Drink a Bottle of Memory and the first recipe you make is remembered forever; a Bottle of Forgetting undoes it.
Amulets extend the timer or trigger the shuffle on demand.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
